name: Build Hakchi Me for macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build universal macOS app and DMG
    runs-on: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          clang --version
          xcrun --sdk macosx --show-sdk-version

      - name: Build app
        run: |
          make clean
          make all

      - name: Validate bundle
        run: |
          plutil -lint "build/Hakchi Me.app/Contents/Info.plist"
          test -x "build/Hakchi Me.app/Contents/MacOS/Hakchi Me"
          file "build/Hakchi Me.app/Contents/MacOS/Hakchi Me"
          lipo -info "build/Hakchi Me.app/Contents/MacOS/Hakchi Me"

      - name: Create DMG
        run: |
          mkdir -p build/dmg
          ditto "build/Hakchi Me.app" "build/dmg/Hakchi Me.app"
          ln -s /Applications "build/dmg/Applications"
          hdiutil create \
            -volname "Hakchi Me" \
            -srcfolder build/dmg \
            -ov \
            -format UDZO \
            "build/Hakchi-Me-macOS.dmg"
          shasum -a 256 "build/Hakchi-Me-macOS.dmg" > "build/Hakchi-Me-macOS.dmg.sha256"

      - name: Upload app and DMG
        uses: actions/upload-artifact@v4
        with:
          name: Hakchi-Me-macOS-${{ github.sha }}
          path: |
            build/Hakchi Me.app
            build/Hakchi-Me-macOS.dmg
            build/Hakchi-Me-macOS.dmg.sha256
          if-no-files-found: error
          retention-days: 14
